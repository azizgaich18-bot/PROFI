<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>PROFI Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <h1>Maitrise par Matière</h1>
    <p class="subtitle">Enzel bch tchouf les détails par matière...</p>

    <div class="cards">
      <!-- Math -->
      <div class="card">
        <img src="assets/icons/math.svg" class="icon" alt="Math">
        <h2>Math</h2>
        <p>MAFAMECH DATA</p>
        <div class="progress"><div style="width:0%"></div></div>
      </div>

      <!-- Physique -->
      <div class="card">
        <img src="assets/icons/physics.svg" class="icon" alt="Physique">
        <h2>Physique</h2>
        <p>1 concept • 3%</p>
        <div class="progress"><div style="width:3%"></div></div>
        <span class="grade">D</span>
      </div>

      <!-- Chimie -->
      <div class="card">
        <img src="assets/icons/science.svg" class="icon" alt="Chimie">
        <h2>Chimie</h2>
        <p>1 concept • 3%</p>
        <div class="progress"><div style="width:3%"></div></div>
        <span class="grade">A</span>
      </div>

      <!-- SVT -->
      <div class="card">
        <img src="assets/icons/philosophy.svg" class="icon" alt="SVT">
        <h2>SVT</h2>
        <p>2 concepts • 4%</p>
        <div class="progress"><div style="width:4%"></div></div>
        <span class="grade">B</span>
      </div>
    </div>
  </div>
</body>
